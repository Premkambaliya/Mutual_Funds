name: Daily Fund Update

on:
  schedule:
    - cron: '0 7 * * *' # every day at 07:00 UTC (adjust to server timezone if needed)
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
        working-directory: ./
      - name: Run update script
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node src/scripts/updateFunds.js
